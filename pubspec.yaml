name: nai_launcher
description: W.O.F NAI Studio - NovelAI Windows 桌面客户端（Aaalice_NAI_Launcher 分支）
publish_to: "none"
version: 2.0.0-preview+7

environment:
  sdk: ">=3.10.7 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 网络请求
  dio: ^5.4.0
  dio_http2_adapter: ^2.3.0
  html: ^0.15.6

  # 图片缓存管理（用于高性能自定义缓存管理器）
  flutter_cache_manager: ^3.3.0

  # Windows 系统代理支持
  win32_registry: ^1.1.3

  # 本地存储
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.2.3

  # SQLite数据库（画廊索引）
  sqflite_common_ffi: ^2.3.4
  sqlite3_flutter_libs: ^0.5.28

  # 加密库 (Blake2b + Argon2id)
  cryptography: ^2.7.0
  crypto: ^3.0.3

  # SHA 哈希（用于生成唯一ID）

  # ZIP 处理
  archive: ^3.6.1

  # MessagePack 解码（流式 API 响应）
  msgpack_dart: ^1.0.1

  # 图片处理
  image: ^4.1.7

  # 拖拽功能
  super_clipboard: ^0.8.23
  super_drag_and_drop: ^0.8.23

  # 路由
  go_router: ^14.2.0

  # UI 组件
  google_fonts: ^6.3.3
  fl_chart: ^0.68.0
  visibility_detector: ^0.4.0+2

  # 数据模型
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # 工具库
  path_provider: ^2.1.3
  path: ^1.9.0
  uuid: ^4.4.0
  intl: ^0.20.2
  collection: ^1.18.0
  synchronized: ^3.1.0
  dart_sentencepiece_tokenizer: ^1.3.0

  ffi: ^2.1.3

  # 文件选择
  file_picker: ^8.0.0

  # 日志
  logger: ^2.4.0

  # 窗口管理 (桌面端)
  window_manager: ^0.3.9
  # 屏幕信息（读取工作区，避免窗口超出屏幕；window_manager 的传递依赖，此处提为直接依赖）
  screen_retriever: any
  tray_manager: ^0.2.3

  # 音效
  audioplayers: ^6.0.0

  # 视频播放
  video_player: ^2.8.0
  video_player_media_kit: ^1.0.5
  media_kit_libs_windows_video: any

  cached_network_image: ^3.4.1
  url_launcher: ^6.3.1
  flutter_staggered_grid_view: ^0.7.0
  timeago: ^3.7.1
  package_info_plus: ^8.0.0

  # 版本号解析
  pub_semver: ^2.1.4
  web_socket_channel: ^3.0.3
  onnxruntime: ^1.4.1
  # 3D 编辑器 WebView (Windows=WebView2)
  flutter_inappwebview: ^6.1.5
  markdown: ^7.3.1
  flutter_markdown_plus: ^1.0.12
  flutter_svg: ^2.3.0
dev_dependencies:
  shared_preferences_platform_interface: any
  irondash_message_channel: any
  super_native_extensions: any
  file: ^7.0.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: 2.4.13
  riverpod_generator: 2.4.0
  freezed: 2.5.2
  json_serializable: 6.8.0
  # Mock 测试
  mocktail: ^1.0.3
  path_provider_platform_interface: any
  sqlite3: ^2.9.4
  # CSV 解析
  csv: ^6.0.0
  analyzer: 6.4.1
  hive_generator: 2.0.1
  build_runner_core: 7.3.2
  build_config: 1.1.2
  source_gen: 1.5.0
flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/local_upscale/
    - assets/local_upscale/windows/
    - assets/local_upscale/models/
    - assets/local_upscale/seedvr2/
    - assets/images/
    - assets/icons/
    - assets/icons/providers/
    - assets/licenses/
    - assets/data/
    - assets/data/tokenizers/
    - assets/sounds/
    - assets/databases/
    - assets/model3d_editor/
    - assets/model3d_editor/vendor/
    - assets/model3d_editor/vendor/addons/controls/
    - assets/model3d_editor/vendor/addons/loaders/
    - assets/model3d_editor/vendor/addons/utils/

  fonts:
    - family: StudioIcons
      fonts:
        - asset: assets/fonts/StudioIcons.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Regular.ttf
          weight: 400
        - asset: assets/fonts/Geist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Geist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Geist-Bold.ttf
          weight: 700
    - family: Geist Mono
      fonts:
        - asset: assets/fonts/GeistMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/GeistMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/GeistMono-Prototype600.ttf
          weight: 600
        - asset: assets/fonts/GeistMono-Prototype700.ttf
          weight: 700
    - family: Geist Pixel Line
      fonts:
        - asset: assets/fonts/GeistPixel-Line.ttf
    - family: Geist Pixel Square
      fonts:
        - asset: assets/fonts/GeistPixel-Square.ttf
    - family: Geist Pixel Circle
      fonts:
        - asset: assets/fonts/GeistPixel-Circle.ttf
    - family: HarmonyOS Sans SC
      fonts:
        - asset: assets/fonts/HarmonyOS_Sans_SC_Regular.ttf
          weight: 400
        - asset: assets/fonts/HarmonyOS_Sans_SC_Medium.ttf
          weight: 500
        - asset: assets/fonts/HarmonyOS_Sans_SC_Bold.ttf
          weight: 600
        - asset: assets/fonts/HarmonyOS_Sans_SC_Bold.ttf
          weight: 700
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
